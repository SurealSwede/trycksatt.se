---
layout: default
---
<article>
  <div class="container--narrow">
    <header class="post-header">
      <p class="post-header__tag">{{ page.tags | first | default: "Artikel" }}</p>
      <h1 class="post-header__title">{{ page.title }}</h1>
      <p class="post-header__meta">
        {{ page.date | date: "%d %B %Y" }} &mdash; {{ page.author | default: "Andreas Surell" }}
      </p>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
  </div>
</article>
